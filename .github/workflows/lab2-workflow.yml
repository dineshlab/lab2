name: Exploring Workflow Dispatch Trigger

on:
  workflow_dispatch:
    inputs:
      run_job:
        type: boolean
        required: false
        description: 'Run Specific Job'    
      custom_message:
        type: string
        required: true
        description: 'Enter a custom_message'


jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Exploring Workflow Dispatch Trigger"

  job2:
    runs-on: ubuntu-latest
    steps:
      - name: Printing Custom Message
        run: echo "${{github.event.workflow.custom_message}}"

      - name: Printing run-job boolean value
        if: inputs.run_job
        run: echo "Input of run_job is ${{inputs.run_job}}"